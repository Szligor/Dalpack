<style id="brand-fonts">/*__FONTS__*/</style>
<style>
  /* Identyfikacja DAL-PACK: zieleń #0C3A30, złoto #C6863B, krem #F3F1EA,
     nagłówki Archivo (wersaliki), tekst IBM Plex Sans */
  :root {
    --brand: #0C3A30;
    --brand-deep: #082A22;
    --gold: #C6863B;
    --gold-hover: #D89A4E;
    --gold-soft: #E4B675;
    --bg: #F3F1EA;
    --surface: #FBFAF5;
    --surface2: #EAE7DD;
    --text: #14211B;
    --text2: #5A665E;
    --border: rgba(20,33,27,0.14);
    --gold-ink: #B0752A;
    --danger: #B04A3B;
    --shadow: 0 1px 2px rgba(12,58,48,.07), 0 10px 30px -18px rgba(12,58,48,.35);
    --font-head: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #082A22;
      --surface: #0F382E;
      --surface2: #17493C;
      --text: #F3F1EA;
      --text2: #9DB4A9;
      --border: rgba(255,255,255,0.14);
      --gold-ink: #E4B675;
      --danger: #D0705F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"] {
    --bg: #F3F1EA; --surface: #FBFAF5; --surface2: #EAE7DD;
    --text: #14211B; --text2: #5A665E; --border: rgba(20,33,27,0.14);
    --gold-ink: #B0752A; --danger: #B04A3B;
    --shadow: 0 1px 2px rgba(12,58,48,.07), 0 10px 30px -18px rgba(12,58,48,.35);
  }
  :root[data-theme="dark"] {
    --bg: #082A22; --surface: #0F382E; --surface2: #17493C;
    --text: #F3F1EA; --text2: #9DB4A9; --border: rgba(255,255,255,0.14);
    --gold-ink: #E4B675; --danger: #D0705F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--gold); color: var(--brand); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: var(--text); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- nagłówek: zawsze firmowa zieleń, jak hero na stronie ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: radial-gradient(160% 170% at 4% 0%, #17825F 0%, #0C3A30 62%);
    color: #fff;
    padding: env(safe-area-inset-top) 14px 10px;
    border-bottom: 3px solid var(--gold);
  }
  .topbar-row { display: flex; align-items: center; gap: 10px; padding-top: 12px; }
  .wordmark { flex: 1; min-width: 0; }
  .wordmark .brand-name {
    font: 800 21px/1 var(--font-head);
    letter-spacing: .04em; text-transform: uppercase; color: #fff;
  }
  .eyebrow { display: flex; align-items: center; gap: 9px; margin-top: 6px; }
  .crates { position: relative; width: 34px; height: 8px; flex: none; }
  .crates i { position: absolute; display: block; background: var(--gold); }
  .crates .line { left: 0; right: 0; bottom: 0; height: 2px; }
  .crates .c1 { bottom: 0; left: 2px;  width: 6px; height: 6px; }
  .crates .c2 { bottom: 0; left: 14px; width: 6px; height: 6px; }
  .crates .c3 { bottom: 0; left: 26px; width: 6px; height: 6px; }
  .eyebrow span {
    font: 600 10px/1.2 var(--font-head);
    letter-spacing: .24em; text-transform: uppercase; color: var(--gold-soft);
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 7px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid rgba(255,255,255,0.32);
    font-size: 1.25rem; color: #fff;
  }
  .search-row { margin-top: 12px; }
  .search-row input {
    width: 100%; background: transparent; border: 0;
    border-bottom: 1.5px solid rgba(255,255,255,0.28);
    color: #fff; padding: 9px 2px; outline: none;
    font: 400 16px var(--font-body); border-radius: 0;
  }
  .search-row input::placeholder { color: rgba(255,255,255,0.45); }
  .search-row input:focus { border-bottom-color: var(--gold); }
  .search-row input:focus-visible { outline: none; }
  .tabs { display: flex; gap: 6px; margin-top: 12px; }
  .tab {
    flex: 1; height: 40px; border-radius: 7px; padding: 0 2px;
    font: 700 10.5px/1 var(--font-head);
    letter-spacing: .07em; text-transform: uppercase;
    background: transparent; border: 1.5px solid rgba(255,255,255,0.34);
    color: rgba(255,255,255,0.88); white-space: nowrap;
  }
  .tab.active { background: var(--gold); border-color: var(--gold); color: var(--brand); }
  .chips {
    display: flex; gap: 7px; margin-top: 10px; overflow-x: auto;
    padding-bottom: 3px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 13px; border-radius: 100px;
    font: 600 10.5px/1 var(--font-body);
    letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.82);
    white-space: nowrap;
  }
  .chip.active { background: var(--gold); border-color: var(--gold); color: var(--brand); }
  .chip.low-chip { border-color: rgba(224,130,110,0.65); color: #EFA593; }
  .chip.low-chip.active { background: #C2523F; border-color: #C2523F; color: #fff; }
  .summary {
    margin-top: 9px; text-align: center;
    font: 400 12.5px/1.4 var(--font-body); color: rgba(255,255,255,0.68);
  }
  .summary b { color: var(--gold-soft); font-weight: 600; font-variant-numeric: tabular-nums; }
  .summary .warn { color: #EFA593; font-weight: 600; }

  /* ---- lista ---- */
  .list { padding: 10px 14px 0; max-width: 640px; margin: 0 auto; }
  .cat-header {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 18px 4px 8px; text-align: left;
  }
  .cat-num { font: 800 13px/1 var(--font-head); color: var(--gold-ink); letter-spacing: .08em; }
  .cat-name {
    font: 700 15px/1.2 var(--font-head);
    text-transform: uppercase; letter-spacing: .03em; color: var(--text);
  }
  .cat-count { font: 400 13px/1 var(--font-body); color: var(--text2); }
  .cat-sum {
    font: 700 11.5px/1 var(--font-head); color: var(--gold-ink);
    letter-spacing: .02em; font-variant-numeric: tabular-nums;
  }
  .cat-lowbadge {
    font: 700 10px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: var(--danger); border-radius: 100px; padding: 4px 8px;
  }
  .cat-chevron { margin-left: auto; color: var(--text2); transition: transform .15s; font-size: .8rem; }
  .collapse-all { display: flex; justify-content: flex-end; padding: 4px 2px 0; }
  .collapse-all button {
    font: 700 10.5px/1 var(--font-head); letter-spacing: .08em; text-transform: uppercase;
    color: var(--text2); padding: 8px 12px; border-radius: 7px; border: 1px solid var(--border);
  }
  .collapse-all button:active { border-color: var(--gold); color: var(--gold-ink); }
  .cat-header.collapsed .cat-chevron { transform: rotate(-90deg); }
  .cat-items {
    border-radius: 10px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--border); min-height: 60px;
  }
  .item:last-child { border-bottom: none; }
  .item.low { box-shadow: inset 3px 0 0 var(--danger); }
  .item.planned { box-shadow: inset 3px 0 0 var(--gold); }
  .item-name {
    flex: 1; text-align: left; padding: 6px 0; min-width: 0;
    font: 400 15.5px/1.35 var(--font-body); color: var(--text);
    overflow-wrap: anywhere;
  }
  .item-sub { display: block; margin-top: 3px; font: 400 12px/1.3 var(--font-body); color: var(--text2); }
  .item-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
  .badge-line {
    font: 600 10.5px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase;
    color: var(--text2); white-space: nowrap;
  }
  .badge-line b {
    font: 700 14px/1 var(--font-head); color: var(--text);
    letter-spacing: 0; font-variant-numeric: tabular-nums;
  }
  .badge-total {
    font: 600 11px/1 var(--font-body); background: var(--surface2);
    border-radius: 100px; padding: 4px 10px; color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  .badge-low {
    font: 700 10.5px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
    color: var(--danger); white-space: nowrap;
  }
  .stepper { display: flex; align-items: center; gap: 3px; flex: none; }
  .step-btn {
    width: 46px; height: 46px; border-radius: 7px;
    font: 600 1.4rem/1 var(--font-head);
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    user-select: none; touch-action: manipulation; color: var(--text);
  }
  .step-btn:active { background: var(--gold); border-color: var(--gold); color: var(--brand); }
  .step-val {
    min-width: 54px; text-align: center; padding: 8px 2px;
    font: 800 19px/1 var(--font-head); color: var(--text);
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .step-val.zero { color: var(--text2); font-weight: 500; }
  .stepper.small .step-btn { width: 40px; height: 40px; font-size: 1.2rem; }
  .stepper.small .step-val { min-width: 42px; font-size: 16px; }
  .check-btn {
    width: 46px; height: 46px; border-radius: 7px; flex: none;
    background: var(--gold); color: var(--brand);
    font: 800 1.2rem/1 var(--font-head);
    display: flex; align-items: center; justify-content: center;
  }
  .check-btn:active { background: var(--gold-hover); }
  .empty-note { text-align: center; color: var(--text2); padding: 44px 20px; }

  .load-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 14px 0 2px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .load-bar .lb-txt { font: 600 11px/1.5 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--text2); }
  .load-bar .lb-txt b { color: var(--gold-ink); font: 800 15px var(--font-head); }
  .load-bar button {
    font: 700 10.5px/1 var(--font-head); letter-spacing: .08em; text-transform: uppercase;
    border: 1.5px solid var(--border); border-radius: 7px; padding: 10px 12px; color: var(--text2);
  }

  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 25;
    height: 54px; padding: 0 24px; border-radius: 7px;
    background: var(--gold); color: var(--brand);
    font: 700 13px/1 var(--font-head); letter-spacing: .1em; text-transform: uppercase;
    box-shadow: 0 14px 30px -12px rgba(12,58,48,.55);
    display: flex; align-items: center; gap: 8px;
  }
  .fab:active { background: var(--gold-hover); }

  /* ---- arkusze ---- */
  .overlay { position: fixed; inset: 0; background: rgba(6,32,26,.55); z-index: 40; display: none; }
  .overlay.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); color: var(--text);
    border-radius: 14px 14px 0 0; border-top: 3px solid var(--gold);
    padding: 6px 18px calc(20px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
    max-height: 88vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .2s ease-out;
    box-shadow: 0 -8px 40px rgba(6,32,26,.4);
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .cat-chevron { transition: none; }
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grip { width: 44px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 16px; }
  .sheet h2 {
    margin: 0 0 4px; font: 700 19px/1.2 var(--font-head);
    text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .sheet .sub {
    font: 600 10.5px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold-ink); margin-bottom: 18px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; margin-bottom: 6px;
    font: 600 11px/1 var(--font-body); letter-spacing: .14em;
    text-transform: uppercase; color: var(--text2);
  }
  .field input, .field select {
    width: 100%; height: 46px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface2); padding: 0 12px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--gold); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .loc-block {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .loc-block .loc-name {
    font: 600 11px/1.4 var(--font-body); letter-spacing: .12em; text-transform: uppercase;
    color: var(--text2);
  }
  .loc-block.min-block { background: transparent; border-style: dashed; }
  .transfer-row { display: flex; gap: 10px; margin: 4px 0 14px; }
  .transfer-btn {
    flex: 1; height: 44px; border-radius: 7px; border: 1.5px dashed var(--border);
    background: none; color: var(--gold-ink);
    font: 700 11px/1.2 var(--font-head); letter-spacing: .08em; text-transform: uppercase;
  }
  .transfer-btn:active { border-color: var(--gold); }
  .sheet-total {
    text-align: center; margin-bottom: 16px;
    font: 600 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase;
    color: var(--text2);
  }
  .sheet-total b {
    display: block; margin-top: 6px;
    font: 800 26px/1 var(--font-head); color: var(--gold-ink);
    letter-spacing: -.01em; font-variant-numeric: tabular-nums;
  }
  .sheet-total b.low { color: var(--danger); }
  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    flex: 1; height: 50px; border-radius: 7px;
    font: 700 13px/1 var(--font-head); letter-spacing: .1em; text-transform: uppercase;
  }
  .btn.primary { background: var(--gold); color: var(--brand); }
  .btn.primary:active { background: var(--gold-hover); }
  .btn.ghost { background: none; border: 1.5px solid var(--border); color: var(--text); }
  .btn.danger-ghost { background: none; border: 1.5px solid var(--danger); color: var(--danger); flex: 0 0 auto; padding: 0 18px; }

  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 16px 4px; text-align: left;
    font: 500 15px/1.3 var(--font-body); color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .menu-item:last-of-type { border-bottom: none; }
  .menu-item .mi-icon { font-size: 1.15rem; width: 28px; text-align: center; }
  .menu-item.danger { color: var(--danger); }

  .hist-item {
    display: flex; align-items: baseline; gap: 12px;
    padding: 12px 2px; border-bottom: 1px solid var(--border);
  }
  .hist-time {
    flex: none; width: 86px;
    font: 600 10.5px/1.5 var(--font-body); letter-spacing: .06em;
    text-transform: uppercase; color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  .hist-txt { font: 400 14px/1.45 var(--font-body); color: var(--text); overflow-wrap: anywhere; }
  .hist-txt b { font-variant-numeric: tabular-nums; }
  .hist-txt .plus { color: #1E9273; font-weight: 700; }
  .hist-txt .minus { color: var(--danger); font-weight: 700; }

  .cat-row {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .cat-row .cat-label {
    flex: 1; min-width: 0; text-align: left; padding: 8px 4px;
    font: 600 15px/1.3 var(--font-head); color: var(--text);
    text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere;
  }
  .cat-row .cat-label small {
    display: block; margin-top: 2px;
    font: 400 11px/1.2 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--text2);
  }
  .cat-row .cat-op {
    width: 40px; height: 40px; flex: none; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .cat-row .cat-op:disabled { opacity: .3; }
  .cat-row .cat-op.del { color: var(--danger); border-color: rgba(176,74,59,.4); background: none; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 60;
    background: #14211B; color: #F3F1EA;
    border-radius: 7px; padding: 12px 16px; font-size: .9rem;
    display: flex; align-items: center; gap: 16px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100vw - 32px); box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button {
    color: var(--gold-soft);
    font: 700 12px/1 var(--font-head); letter-spacing: .1em; text-transform: uppercase;
    flex: none;
  }
</style>

<header class="topbar">
  <div class="topbar-row">
    <div class="wordmark">
      <div class="brand-name">Dal-Pack</div>
      <div class="eyebrow">
        <div class="crates" aria-hidden="true"><i class="line"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>
        <span>Magazyn materiałów</span>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">⋮</button>
  </div>
  <div class="search-row">
    <input type="search" id="searchInput" placeholder="Szukaj materiału…" autocomplete="off">
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">Wszystko</button>
    <button class="tab" data-tab="auto">Auto</button>
    <button class="tab" data-tab="opole">Opole</button>
    <button class="tab" data-tab="load">Załadunek</button>
  </div>
  <div class="chips" id="catChips"></div>
  <div class="summary" id="summary"></div>
</header>

<main class="list" id="list"></main>

<button class="fab" id="addBtn">＋ Dodaj</button>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="itemSheet">
  <div class="sheet-grip"></div>
  <h2 id="sheetTitle"></h2>
  <div class="sub" id="sheetSub"></div>
  <div class="loc-block">
    <span class="loc-name">Na aucie</span>
    <div class="stepper">
      <button class="step-btn" data-loc="auto" data-d="-1">−</button>
      <button class="step-val" id="sheetAutoVal"></button>
      <button class="step-btn" data-loc="auto" data-d="1">+</button>
    </div>
  </div>
  <div class="transfer-row">
    <button class="transfer-btn" id="toOpole">⬇ Przenieś 1 do Opola</button>
    <button class="transfer-btn" id="toAuto">⬆ Przenieś 1 na auto</button>
  </div>
  <div class="loc-block">
    <span class="loc-name">Magazyn Opole</span>
    <div class="stepper">
      <button class="step-btn" data-loc="opole" data-d="-1">−</button>
      <button class="step-val" id="sheetOpoleVal"></button>
      <button class="step-btn" data-loc="opole" data-d="1">+</button>
    </div>
  </div>
  <div class="loc-block min-block">
    <span class="loc-name">Stan minimalny (Σ)</span>
    <div class="stepper small">
      <button class="step-btn" data-min data-d="-1">−</button>
      <button class="step-val" id="sheetMinVal"></button>
      <button class="step-btn" data-min data-d="1">+</button>
    </div>
  </div>
  <div class="sheet-total">Razem <b id="sheetTotal"></b></div>
  <div class="field">
    <label for="editName">Nazwa</label>
    <input type="text" id="editName">
  </div>
  <div class="field-row">
    <div class="field">
      <label for="editCat">Kategoria</label>
      <select id="editCat"></select>
    </div>
    <div class="field" style="flex:0 0 118px">
      <label for="editUnit">Jednostka</label>
      <select id="editUnit"></select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn danger-ghost" id="deleteBtn" aria-label="Usuń">🗑</button>
    <button class="btn primary" id="closeItemBtn">Gotowe</button>
  </div>
</div>

<div class="sheet" id="addSheet">
  <div class="sheet-grip"></div>
  <h2>Nowy materiał</h2>
  <div class="sub">Dodaj pozycję do magazynu</div>
  <div class="field">
    <label for="newName">Nazwa</label>
    <input type="text" id="newName" placeholder="np. Wkręty 160 mm">

    <div class="stepper">
      <button class="step-btn" data-new="opole" data-d="-1">−</button>
      <button class="step-val" id="newOpoleVal">0</button>
      <button class="step-btn" data-new="opole" data-d="1">+</button>

  <div class="field-row" style="align-items:flex-end;margin-top:6px">
    <div class="field" style="margin-bottom:0">
      <label for="newCatName">Nowa kategoria</label>
      <input type="text" id="newCatName" placeholder="np. Narzędzia" autocomplete="off">

    <button class="btn primary" id="addCatBtn" style="flex:0 0 auto;padding:0 20px;height:46px">Dodaj</button>

  </div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="undoBtn">Cofnij</button>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'dalpack-magazyn-v1';
  var CATEGORIES = ['Mocowanie', 'Pakowanie', 'Folia', 'Pasy', 'Czujniki'];
  var UNITS = ['szt.', 'm', 'rolka', 'kg', 'op.', 'kpl.', 'para'];
  var HISTORY_MAX = 300;
  var MERGE_WINDOW_MS = 2 * 60 * 1000; // scalanie serii +1/+1/+1 w jeden wpis

  // Stan startowy — odwzorowanie bazy Notion „Magazyn materiałów”
  var SEED = [
    ['Gwoździe — małe', 'Mocowanie'], ['Gwoździe — średnie', 'Mocowanie'], ['Gwoździe — duże', 'Mocowanie'],
    ['Haki', 'Mocowanie'], ['Metalowe uszy', 'Mocowanie'],
    ['Okucia — lewe', 'Mocowanie'], ['Okucia — prawe', 'Mocowanie'], ['Okucia — podłużne', 'Mocowanie'],
    ['Podkładki gumowe', 'Mocowanie'],
    ['Podkładki metalowe — małe', 'Mocowanie'], ['Podkładki metalowe — średnie', 'Mocowanie'], ['Podkładki metalowe — duże', 'Mocowanie'],
    ['Wkręty 120 mm', 'Mocowanie'], ['Wkręty 140 mm', 'Mocowanie'], ['Wkręty 180 mm', 'Mocowanie'],
    ['Wkręty 220 mm', 'Mocowanie'], ['Wkręty 240 mm', 'Mocowanie'],
    ['Gąbka zabezpieczająca w rolce', 'Pakowanie'], ['Niebieskie gumy — podkłady', 'Pakowanie'],
    ['Pochłaniacze', 'Pakowanie'], ['Taśma — szeroka', 'Pakowanie'], ['Taśma — wąska', 'Pakowanie'],
    ['Worki sztauerskie', 'Pakowanie'],
    ['Folia Alu', 'Folia'], ['Folia FCI', 'Folia'], ['Folia — mała rolka', 'Folia'],
    ['Folia biała — 4 m szerokości', 'Folia'], ['Folia biała — 6 m szerokości', 'Folia'],
    ['Folia biała — 8 m szerokości', 'Folia'], ['Folia biała — 10 m szerokości', 'Folia'],
    ['Klamry', 'Pasy'], ['Kubuś (pas do czap)', 'Pasy'], ['Pas biały', 'Pasy'],
    ['Pas pomarańczowy', 'Pasy'], ['Spinki', 'Pasy'],
    ['Czujnik korozji', 'Czujniki'], ['Czujnik pochyłu', 'Czujniki'], ['Czujnik wilgoci', 'Czujniki'],
    ['Czujnik wstrząsu', 'Czujniki'], ['Metalowe klapki', 'Czujniki']
  ];

  function seedItems() {
    return SEED.map(function (row, i) {
      return { id: 's' + i, name: row[0], cat: row[1], auto: 0, opole: 0, min: 0, unit: 'szt.' };
    });
  }

  function normalizeItem(x, i) {
    return {
      id: x.id || 'i' + Date.now() + '_' + i,
      name: x.name,
      cat: typeof x.cat === 'string' ? x.cat : 'Mocowanie',
      auto: typeof x.auto === 'number' ? x.auto : 0,
      opole: typeof x.opole === 'number' ? x.opole : 0,
      min: typeof x.min === 'number' && x.min > 0 ? x.min : 0,
      unit: typeof x.unit === 'string' && x.unit ? x.unit : 'szt.'
    };
  }

  function loadState() {
    var s = null;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) s = JSON.parse(raw);
    } catch (e) { /* uszkodzone dane — start od nowa */ }
    if (!s || !Array.isArray(s.items)) {
      s = { items: seedItems(), collapsed: {}, tab: 'all', updated: null };
    }
    s.items = s.items.filter(function (x) { return x && typeof x.name === 'string'; }).map(normalizeItem);
    s.collapsed = s.collapsed || {};
    s.catFilter = s.catFilter || null;
    s.loadPlan = s.loadPlan || {};
    s.history = Array.isArray(s.history) ? s.history : [];
    // Uporządkowana, trwała lista kategorii. Migracja ze starej logiki:
    // stałe kategorie + wszystkie wykryte z pozycji, z zachowaniem kolejności.
    if (!Array.isArray(s.categories) || !s.categories.length) {
      s.categories = CATEGORIES.slice();
    }
    s.items.forEach(function (it) {
      if (s.categories.indexOf(it.cat) === -1) s.categories.push(it.cat);
    });
    return s;
  }

  var state = loadState();
  var undoSnapshot = null;
  var toastTimer = null;
  var currentItemId = null;
  var newItemQty = { auto: 0, opole: 0 };

  function save() {
    state.updated = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function fmt(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '0';
    return (Math.round(n * 100) / 100).toString().replace('.', ',');
  }

  function unitSuffix(it) { return it.unit && it.unit !== 'szt.' ? ' ' + it.unit : ''; }

  function findItem(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }

  function totalOf(it) { return (it.auto || 0) + (it.opole || 0); }
  function isLow(it) { return (it.min || 0) > 0 && totalOf(it) < it.min; }
  function lowCount() { return state.items.filter(isLow).length; }

  function allCats() {
    var names = state.categories.slice();
    // bezpiecznik: gdyby pozycja miała kategorię spoza listy (np. po imporcie)
    state.items.forEach(function (it) {
      if (names.indexOf(it.cat) === -1) names.push(it.cat);
    });
    return names;
  }

  // ---------- historia ----------
  function logEvent(kind, data) {
    var now = Date.now();
    var h = state.history;
    if (kind === 'qty' || kind === 'transfer' || kind === 'load') {
      var last = h[0];
      if (last && last.kind === kind && last.id === data.id && last.loc === data.loc &&
          last.dir === data.dir && (now - last.t) < MERGE_WINDOW_MS) {
        last.delta = Math.round((last.delta + data.delta) * 100) / 100;
        last.t = now;
        if (kind === 'qty' && last.delta === 0) h.shift();
        return;
      }
    }
    h.unshift({ t: now, kind: kind, id: data.id || null, name: data.name || '', loc: data.loc || '', dir: data.dir || '', delta: data.delta || 0, txt: data.txt || '' });
    if (h.length > HISTORY_MAX) h.length = HISTORY_MAX;
  }

  function histText(e) {
    var locName = { auto: 'Auto', opole: 'Opole' };
    var d = fmt(Math.abs(e.delta));
    switch (e.kind) {
      case 'qty':
        return e.name + ' — ' + locName[e.loc] + ' <b class="' + (e.delta >= 0 ? 'plus' : 'minus') + '">' +
          (e.delta >= 0 ? '+' : '−') + d + '</b>';
      case 'set':
        return e.name + ' — ' + locName[e.loc] + ' ustawiono na <b>' + fmt(e.delta) + '</b>';
      case 'transfer':
        return e.name + ' — przeniesiono <b>' + d + '</b> ' + (e.dir === 'auto>opole' ? 'do Opola' : 'na auto');
      case 'load':
        return e.name + ' — załadunek na auto <b class="plus">+' + d + '</b>';
      case 'add': return 'Dodano „' + e.name + '”';
      case 'del': return 'Usunięto „' + e.name + '”';
      case 'reset': return 'Przywrócono dane startowe';
      case 'import': return 'Zaimportowano dane (' + fmt(e.delta) + ' pozycji)';
      default: return e.txt || '';
    }
  }

  // ---------- render ----------
  var listEl = document.getElementById('list');
  var summaryEl = document.getElementById('summary');
  var searchInput = document.getElementById('searchInput');
  var chipsEl = document.getElementById('catChips');

  function matchesFilters(it, q) {
    if (q && it.name.toLowerCase().indexOf(q) === -1) return false;
    if (state.catFilter === '__low__') return isLow(it);
    if (state.catFilter && it.cat !== state.catFilter) return false;
    return true;
  }

  function renderChips() {
    chipsEl.innerHTML = '';
    var defs = [{ key: null, label: 'Wszystkie' }];
    var lc = lowCount();
    defs.push({ key: '__low__', label: 'Braki' + (lc ? ' · ' + lc : ''), low: true });
    allCats().forEach(function (c) { defs.push({ key: c, label: c }); });
    defs.forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'chip' + (d.low ? ' low-chip' : '') + (state.catFilter === d.key ? ' active' : '');
      b.textContent = d.label;
      b.addEventListener('click', function () {
        state.catFilter = (state.catFilter === d.key) ? null : d.key;
        save(); render();
      });
      chipsEl.appendChild(b);
    });
  }

  function renderCollapseAll(cats) {
    var visible = cats.filter(function (c) {
      return state.items.some(function (it) { return it.cat === c; });
    });
    if (visible.length < 2) return;
    var anyOpen = visible.some(function (c) { return !state.collapsed[c]; });
    var bar = document.createElement('div');
    bar.className = 'collapse-all';
    var btn = document.createElement('button');
    btn.textContent = anyOpen ? '⌄ Zwiń wszystko' : '⌃ Rozwiń wszystko';
    btn.addEventListener('click', function () {
      visible.forEach(function (c) { state.collapsed[c] = anyOpen; });
      save(); render();
    });
    bar.appendChild(btn);
    listEl.appendChild(bar);
  }

  function render() {
    renderChips();
    var q = searchInput.value.trim().toLowerCase();
    var tab = state.tab;
    listEl.innerHTML = '';

    var sumAuto = 0, sumOpole = 0, shown = 0;
    var cats = allCats();
    var canCollapse = !q && state.catFilter === null && tab !== 'load';

    if (tab === 'load') renderLoadBar();
    if (canCollapse) renderCollapseAll(cats);

    cats.forEach(function (catName, catIdx) {
      var items = state.items.filter(function (it) { return it.cat === catName && matchesFilters(it, q); });
      if (!items.length) return;
      items.sort(function (a, b) { return a.name.localeCompare(b.name, 'pl'); });

      var collapsed = canCollapse && state.collapsed[catName];

      // suma zależna od widoku + liczba braków w tej kategorii
      var catSum = 0, catLow = 0;
      items.forEach(function (it) {
        catSum += tab === 'auto' ? (it.auto || 0) : tab === 'opole' ? (it.opole || 0) : totalOf(it);
        if (isLow(it)) catLow++;
      });

      var header = document.createElement('button');
      header.className = 'cat-header' + (collapsed ? ' collapsed' : '');
      header.innerHTML =
        '<span class="cat-num">' + String(catIdx + 1).padStart(2, '0') + '</span>' +
        '<span class="cat-name"></span><span class="cat-count">' + items.length + '</span>' +
        (tab === 'load' ? '' : '<span class="cat-sum">Σ ' + fmt(catSum) + '</span>') +
        (catLow ? '<span class="cat-lowbadge">braki ' + catLow + '</span>' : '') +
        '<span class="cat-chevron">▼</span>';
      header.querySelector('.cat-name').textContent = catName;
      header.addEventListener('click', function () {
        state.collapsed[catName] = !state.collapsed[catName];
        save(); render();
      });
      listEl.appendChild(header);

      var box = document.createElement('div');
      box.className = 'cat-items';

      items.forEach(function (it) {
        sumAuto += it.auto || 0;
        sumOpole += it.opole || 0;
        shown++;
        if (collapsed) return;
        box.appendChild(tab === 'load' ? buildLoadRow(it) : buildRow(it, tab));
      });

      if (!collapsed) listEl.appendChild(box);
    });

    if (!shown) {
      var note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = q ? 'Brak wyników dla „' + searchInput.value.trim() + '”'
        : (state.catFilter === '__low__' ? 'Nic nie brakuje — wszystkie stany powyżej minimum. 💪'
          : 'Magazyn jest pusty — dodaj pierwszy materiał.');
      listEl.appendChild(note);
    }

    var lowAll = lowCount();
    var lowTxt = lowAll ? ' · <span class="warn">Braki ' + lowAll + '</span>' : '';
    if (tab === 'auto') summaryEl.innerHTML = 'Na aucie łącznie: <b>' + fmt(sumAuto) + '</b>' + lowTxt;
    else if (tab === 'opole') summaryEl.innerHTML = 'W Opolu łącznie: <b>' + fmt(sumOpole) + '</b>' + lowTxt;
    else if (tab === 'load') {
      var p = plannedInfo();
      summaryEl.innerHTML = p.count
        ? 'Do załadunku: <b>' + p.count + '</b> pozycji · razem <b>' + fmt(p.qty) + '</b>'
        : 'Ustaw ilości do zabrania z Opola, potem odhaczaj ✓ przy załadunku.';
    }
    else summaryEl.innerHTML = shown + ' pozycji · Auto <b>' + fmt(sumAuto) + '</b> · Opole <b>' + fmt(sumOpole) + '</b>' + lowTxt;
  }

  function buildRow(it, tab) {
    var row = document.createElement('div');
    row.className = 'item' + (isLow(it) ? ' low' : '');

    var nameBtn = document.createElement('button');
    nameBtn.className = 'item-name';
    nameBtn.textContent = it.name;
    nameBtn.addEventListener('click', function () { openItemSheet(it.id); });
    row.appendChild(nameBtn);

    if (tab === 'all') {
      var badges = document.createElement('button');
      badges.className = 'item-badges';
      var lowHtml = isLow(it)
        ? '<span class="badge-low">brakuje ' + fmt(it.min - totalOf(it)) + '</span>'
        : '<span class="badge-total">Σ ' + fmt(totalOf(it)) + unitSuffix(it) + '</span>';
      badges.innerHTML =
        '<span class="badge-line">Auto <b>' + fmt(it.auto) + '</b> · Opole <b>' + fmt(it.opole) + '</b></span>' + lowHtml;
      badges.addEventListener('click', function () { openItemSheet(it.id); });
      row.appendChild(badges);
    } else {
      row.appendChild(buildStepper(it, tab));
    }
    return row;
  }

  // ---------- widok „Załadunek” ----------
  function plannedInfo() {
    var count = 0, qty = 0;
    Object.keys(state.loadPlan).forEach(function (id) {
      var v = state.loadPlan[id];
      if (v > 0 && findItem(id)) { count++; qty += v; }
    });
    return { count: count, qty: qty };
  }

  function renderLoadBar() {
    var bar = document.createElement('div');
    bar.className = 'load-bar';
    var p = plannedInfo();
    bar.innerHTML = '<span class="lb-txt">Plan załadunku: <b>' + p.count + '</b> poz.</span>';
    var clear = document.createElement('button');
    clear.textContent = 'Wyczyść plan';
    clear.disabled = !p.count;
    clear.style.opacity = p.count ? '' : '.45';
    clear.addEventListener('click', function () {
      if (!p.count || !confirm('Wyczyścić cały plan załadunku?')) return;
      state.loadPlan = {};
      save(); render();
    });
    bar.appendChild(clear);
    listEl.appendChild(bar);
  }

  function buildLoadRow(it) {
    var plan = state.loadPlan[it.id] || 0;
    var row = document.createElement('div');
    row.className = 'item' + (plan > 0 ? ' planned' : '');

    var nameBtn = document.createElement('button');
    nameBtn.className = 'item-name';
    nameBtn.textContent = it.name;
    var sub = document.createElement('span');
    sub.className = 'item-sub';
    sub.textContent = 'Opole ' + fmt(it.opole) + ' · Auto ' + fmt(it.auto) + unitSuffix(it);
    nameBtn.appendChild(sub);
    nameBtn.addEventListener('click', function () { openItemSheet(it.id); });
    row.appendChild(nameBtn);

    var wrap = document.createElement('div');
    wrap.className = 'stepper small';

    var minus = document.createElement('button');
    minus.className = 'step-btn';
    minus.textContent = '−';
    attachHold(minus, function () { changePlan(it.id, -1); });

    var val = document.createElement('button');
    val.className = 'step-val' + (plan ? '' : ' zero');
    val.textContent = fmt(plan);
    val.addEventListener('click', function () { promptPlan(it.id); });

    var plus = document.createElement('button');
    plus.className = 'step-btn';
    plus.textContent = '+';
    attachHold(plus, function () { changePlan(it.id, 1); });

    wrap.appendChild(minus); wrap.appendChild(val); wrap.appendChild(plus);
    row.appendChild(wrap);

    if (plan > 0) {
      var check = document.createElement('button');
      check.className = 'check-btn';
      check.textContent = '✓';
      check.setAttribute('aria-label', 'Załaduj');
      check.addEventListener('click', function () { executeLoad(it.id); });
      row.appendChild(check);
    }
    return row;
  }

  function changePlan(id, delta) {
    var v = (state.loadPlan[id] || 0) + delta;
    if (v <= 0) delete state.loadPlan[id];
    else state.loadPlan[id] = Math.round(v * 100) / 100;
    save(); render();
  }

  function promptPlan(id) {
    var it = findItem(id);
    if (!it) return;
    var input = prompt(it.name + ' — ile zabrać z Opola?', String(state.loadPlan[id] || 0));
    if (input === null) return;
    var v = parseFloat(input.replace(',', '.'));
    if (isNaN(v) || v < 0) return;
    if (v === 0) delete state.loadPlan[id];
    else state.loadPlan[id] = Math.round(v * 100) / 100;
    save(); render();
  }

  function executeLoad(id) {
    var it = findItem(id);
    var plan = state.loadPlan[id] || 0;
    if (!it || plan <= 0) return;
    var avail = it.opole || 0;
    if (avail <= 0) {
      showToast('Brak „' + it.name + '” w Opolu — nie przeniesiono', false);
      return;
    }
    snapshot('Załadunek: ' + it.name);
    var moved = Math.min(plan, avail);
    it.opole = Math.round((it.opole - moved) * 100) / 100;
    it.auto = Math.round(((it.auto || 0) + moved) * 100) / 100;
    delete state.loadPlan[id];
    logEvent('load', { id: it.id, name: it.name, delta: moved });
    save(); render();
    showToast(moved < plan
      ? 'Załadowano tylko ' + fmt(moved) + ' — tyle było w Opolu'
      : 'Załadowano: ' + it.name + ' (' + fmt(moved) + ')', true);
  }

  // ---------- steppery ----------
  function buildStepper(it, loc) {
    var wrap = document.createElement('div');
    wrap.className = 'stepper';

    var minus = document.createElement('button');
    minus.className = 'step-btn';
    minus.textContent = '−';
    attachHold(minus, function () { changeQty(it.id, loc, -1); });

    var val = document.createElement('button');
    val.className = 'step-val' + (it[loc] ? '' : ' zero');
    val.textContent = fmt(it[loc]);
    val.addEventListener('click', function () { promptQty(it.id, loc); });

    var plus = document.createElement('button');
    plus.className = 'step-btn';
    plus.textContent = '+';
    attachHold(plus, function () { changeQty(it.id, loc, 1); });

    wrap.appendChild(minus); wrap.appendChild(val); wrap.appendChild(plus);
    return wrap;
  }

  // Przytrzymanie przycisku = szybkie zliczanie.
  // Stop nasłuchuje na document, bo render() usuwa przycisk z DOM
  // zanim dotrze pointerup — inaczej interwał nigdy by się nie zatrzymał.
  var holdStop = null;
  function endHold() {
    if (holdStop) { holdStop(); holdStop = null; }
  }
  document.addEventListener('pointerup', endHold, true);
  document.addEventListener('pointercancel', endHold, true);
  window.addEventListener('blur', endHold);

  function attachHold(btn, fn) {
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      endHold();
      fn();
      var interval = null;
      var timer = setTimeout(function () {
        interval = setInterval(fn, 120);
      }, 450);
      holdStop = function () {
        clearTimeout(timer);
        clearInterval(interval);
      };
    });
    btn.addEventListener('click', function (e) { e.preventDefault(); });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  // ---------- zmiany ilości ----------
  function snapshot(msg) {
    undoSnapshot = {
      items: JSON.parse(JSON.stringify(state.items)),
      loadPlan: JSON.parse(JSON.stringify(state.loadPlan)),
      categories: state.categories.slice(),
      msg: msg
    };
  }

  function changeQty(id, loc, delta) {
    var it = findItem(id);
    if (!it) return;
    var v = (it[loc] || 0) + delta;
    if (v < 0) v = 0;
    if (v === it[loc]) return;
    var real = v - (it[loc] || 0);
    it[loc] = Math.round(v * 100) / 100;
    logEvent('qty', { id: it.id, name: it.name, loc: loc, delta: real });
    save(); render(); refreshItemSheet();
  }

  function promptQty(id, loc) {
    var it = findItem(id);
    if (!it) return;
    var label = loc === 'auto' ? 'Na aucie' : 'Magazyn Opole';
    var input = prompt(it.name + ' — ' + label + ':', String(it[loc] || 0));
    if (input === null) return;
    var v = parseFloat(input.replace(',', '.'));
    if (isNaN(v) || v < 0) return;
    v = Math.round(v * 100) / 100;
    if (v === it[loc]) return;
    it[loc] = v;
    logEvent('set', { id: it.id, name: it.name, loc: loc, delta: v });
    save(); render(); refreshItemSheet();
  }

  function changeMin(id, delta) {
    var it = findItem(id);
    if (!it) return;
    var v = (it.min || 0) + delta;
    if (v < 0) v = 0;
    it.min = Math.round(v * 100) / 100;
    save(); render(); refreshItemSheet();
  }

  function promptMin(id) {
    var it = findItem(id);
    if (!it) return;
    var input = prompt(it.name + ' — stan minimalny (0 = bez alertu):', String(it.min || 0));
    if (input === null) return;
    var v = parseFloat(input.replace(',', '.'));
    if (isNaN(v) || v < 0) return;
    it.min = Math.round(v * 100) / 100;
    save(); render(); refreshItemSheet();
  }

  // ---------- arkusze (bottom sheets) ----------
  var overlay = document.getElementById('overlay');
  var itemSheet = document.getElementById('itemSheet');
  var addSheet = document.getElementById('addSheet');
  var menuSheet = document.getElementById('menuSheet');
  var histSheet = document.getElementById('histSheet');
  var catSheet = document.getElementById('catSheet');

  function openSheet(sheet) {
    closeSheets();
    overlay.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheets() {
    commitItemEdits();
    overlay.classList.remove('open');
    [itemSheet, addSheet, menuSheet, histSheet, catSheet].forEach(function (s) { s.classList.remove('open'); });
    currentItemId = null;
  }
  overlay.addEventListener('click', closeSheets);

  function fillCatSelect(sel, value) {
    sel.innerHTML = '';
    allCats().forEach(function (c) {
      var o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
    if (value) sel.value = value;
  }

  function fillUnitSelect(sel, value) {
    sel.innerHTML = '';
    var units = UNITS.slice();
    if (value && units.indexOf(value) === -1) units.push(value);
    units.forEach(function (u) {
      var o = document.createElement('option');
      o.value = u; o.textContent = u;
      sel.appendChild(o);
    });
    sel.value = value || 'szt.';
  }

  function openItemSheet(id) {
    var it = findItem(id);
    if (!it) return;
    openSheet(itemSheet); // najpierw: openSheet -> closeSheets zeruje currentItemId
    currentItemId = id;
    document.getElementById('editName').value = it.name;
    fillCatSelect(document.getElementById('editCat'), it.cat);
    fillUnitSelect(document.getElementById('editUnit'), it.unit);
    refreshItemSheet();
  }

  function refreshItemSheet() {
    if (!currentItemId) return;
    var it = findItem(currentItemId);
    if (!it) return;
    document.getElementById('sheetTitle').textContent = it.name;
    document.getElementById('sheetSub').textContent = it.cat + (it.unit !== 'szt.' ? ' · ' + it.unit : '');
    var av = document.getElementById('sheetAutoVal');
    var ov = document.getElementById('sheetOpoleVal');
    var mv = document.getElementById('sheetMinVal');
    av.textContent = fmt(it.auto);
    ov.textContent = fmt(it.opole);
    mv.textContent = fmt(it.min || 0);
    av.className = 'step-val' + (it.auto ? '' : ' zero');
    ov.className = 'step-val' + (it.opole ? '' : ' zero');
    mv.className = 'step-val' + (it.min ? '' : ' zero');
    var tot = document.getElementById('sheetTotal');
    tot.textContent = fmt(totalOf(it)) + unitSuffix(it) + (isLow(it) ? ' — poniżej minimum!' : '');
    tot.className = isLow(it) ? 'low' : '';
  }

  function commitItemEdits() {
    if (!currentItemId) return;
    var it = findItem(currentItemId);
    if (!it) return;
    var name = document.getElementById('editName').value.trim();
    var cat = document.getElementById('editCat').value;
    var unit = document.getElementById('editUnit').value;
    if (name && (name !== it.name || cat !== it.cat || unit !== it.unit)) {
      it.name = name;
      it.cat = cat;
      it.unit = unit;
      save(); render();
    }
  }

  itemSheet.querySelectorAll('.step-btn[data-loc]').forEach(function (btn) {
    attachHold(btn, function () {
      changeQty(currentItemId, btn.dataset.loc, parseInt(btn.dataset.d, 10));
    });
  });
  itemSheet.querySelectorAll('.step-btn[data-min]').forEach(function (btn) {
    attachHold(btn, function () {
      changeMin(currentItemId, parseInt(btn.dataset.d, 10));
    });
  });
  document.getElementById('sheetAutoVal').addEventListener('click', function () { promptQty(currentItemId, 'auto'); });
  document.getElementById('sheetOpoleVal').addEventListener('click', function () { promptQty(currentItemId, 'opole'); });
  document.getElementById('sheetMinVal').addEventListener('click', function () { promptMin(currentItemId); });

  document.getElementById('toOpole').addEventListener('click', function () { transfer('auto', 'opole'); });
  document.getElementById('toAuto').addEventListener('click', function () { transfer('opole', 'auto'); });

  function transfer(from, to) {
    var it = findItem(currentItemId);
    if (!it || (it[from] || 0) < 1) {
      showToast(from === 'auto' ? 'Brak sztuk na aucie' : 'Brak sztuk w Opolu', false);
      return;
    }
    it[from] = Math.round((it[from] - 1) * 100) / 100;
    it[to] = Math.round(((it[to] || 0) + 1) * 100) / 100;
    logEvent('transfer', { id: it.id, name: it.name, dir: from === 'auto' ? 'auto>opole' : 'opole>auto', delta: 1 });
    save(); render(); refreshItemSheet();
  }

  document.getElementById('closeItemBtn').addEventListener('click', closeSheets);

  document.getElementById('deleteBtn').addEventListener('click', function () {
    var it = findItem(currentItemId);
    if (!it) return;
    if (!confirm('Usunąć „' + it.name + '” z magazynu?')) return;
    snapshot('Usunięto „' + it.name + '”');
    state.items = state.items.filter(function (x) { return x.id !== currentItemId; });
    delete state.loadPlan[it.id];
    logEvent('del', { id: it.id, name: it.name });
    currentItemId = null;
    save(); render(); closeSheets();
    showToast(undoSnapshot.msg, true);
  });

  // ---------- dodawanie ----------
  document.getElementById('addBtn').addEventListener('click', function () {
    newItemQty = { auto: 0, opole: 0 };
    document.getElementById('newName').value = '';
    document.getElementById('newAutoVal').textContent = '0';
    document.getElementById('newOpoleVal').textContent = '0';
    fillCatSelect(document.getElementById('newCat'),
      state.catFilter && state.catFilter !== '__low__' ? state.catFilter : null);
    fillUnitSelect(document.getElementById('newUnit'));
    openSheet(addSheet);
    setTimeout(function () { document.getElementById('newName').focus(); }, 250);
  });

  addSheet.querySelectorAll('.step-btn[data-new]').forEach(function (btn) {
    attachHold(btn, function () {
      var loc = btn.dataset.new;
      var v = newItemQty[loc] + parseInt(btn.dataset.d, 10);
      newItemQty[loc] = v < 0 ? 0 : v;
      document.getElementById(loc === 'auto' ? 'newAutoVal' : 'newOpoleVal').textContent = fmt(newItemQty[loc]);
    });
  });

  document.getElementById('cancelAddBtn').addEventListener('click', closeSheets);
  document.getElementById('saveAddBtn').addEventListener('click', function () {
    var name = document.getElementById('newName').value.trim();
    if (!name) { document.getElementById('newName').focus(); return; }
    var item = {
      id: 'u' + Date.now(),
      name: name,
      cat: document.getElementById('newCat').value,
      unit: document.getElementById('newUnit').value,
      min: 0,
      auto: newItemQty.auto,
      opole: newItemQty.opole
    };
    state.items.push(item);
    logEvent('add', { id: item.id, name: item.name });
    save(); render(); closeSheets();
    showToast('Dodano „' + name + '”', false);
  });

  // ---------- menu ----------
  document.getElementById('menuBtn').addEventListener('click', function () {
    var d = state.updated ? new Date(state.updated) : null;
    var lc = lowCount();
    document.getElementById('menuInfo').textContent =
      state.items.length + ' pozycji' + (lc ? ' · braki: ' + lc : '') +
      (d ? ' · ostatnia zmiana: ' + d.toLocaleString('pl-PL') : '');
    openSheet(menuSheet);
  });

  // ---------- historia (widok) ----------
  function fmtHistTime(t) {
    var d = new Date(t);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var time = d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return 'dziś ' + time;
    return d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' }) + ' ' + time;
  }

  function openHistSheet() {
    var box = document.getElementById('histList');
    box.innerHTML = '';
    var h = state.history;
    document.getElementById('histInfo').textContent = h.length
      ? 'Ostatnie operacje (' + h.length + ')'
      : 'Brak zapisanych operacji';
    h.slice(0, 150).forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'hist-item';
      row.innerHTML = '<span class="hist-time">' + fmtHistTime(e.t) + '</span><span class="hist-txt">' + histText(e) + '</span>';
      box.appendChild(row);
    });
    openSheet(histSheet);
  }

  document.getElementById('historyBtn').addEventListener('click', openHistSheet);
  document.getElementById('closeHistBtn').addEventListener('click', closeSheets);
  document.getElementById('clearHistBtn').addEventListener('click', function () {
    if (!state.history.length || !confirm('Wyczyścić całą historię zmian?')) return;
    state.history = [];
    save(); openHistSheet();
  });

  // ---------- zarządzanie kategoriami ----------
  function itemsInCat(name) {
    return state.items.filter(function (it) { return it.cat === name; }).length;
  }

  function renderCatList() {
    var box = document.getElementById('catList');
    box.innerHTML = '';
    var cats = allCats();
    cats.forEach(function (name, idx) {
      var cnt = itemsInCat(name);
      var row = document.createElement('div');
      row.className = 'cat-row';

      var label = document.createElement('button');
      label.className = 'cat-label';
      label.innerHTML = '<span></span><small>' + cnt + (cnt === 1 ? ' pozycja' : (cnt >= 2 && cnt <= 4 ? ' pozycje' : ' pozycji')) + '</small>';
      label.querySelector('span').textContent = name;
      label.addEventListener('click', function () { renameCat(name); });
      row.appendChild(label);

      var up = document.createElement('button');
      up.className = 'cat-op'; up.textContent = '▲'; up.setAttribute('aria-label', 'W górę');
      up.disabled = idx === 0;
      up.addEventListener('click', function () { moveCat(idx, -1); });
      row.appendChild(up);

      var down = document.createElement('button');
      down.className = 'cat-op'; down.textContent = '▼'; down.setAttribute('aria-label', 'W dół');
      down.disabled = idx === cats.length - 1;
      down.addEventListener('click', function () { moveCat(idx, 1); });
      row.appendChild(down);

      var del = document.createElement('button');
      del.className = 'cat-op del'; del.textContent = '🗑'; del.setAttribute('aria-label', 'Usuń');
      del.addEventListener('click', function () { deleteCat(name); });
      row.appendChild(del);

      box.appendChild(row);
    });
  }

  function openCatSheet() {
    document.getElementById('newCatName').value = '';
    renderCatList();
    openSheet(catSheet);
  }

  function renameCat(oldName) {
    var input = prompt('Nowa nazwa kategorii:', oldName);
    if (input === null) return;
    var name = input.trim();
    if (!name || name === oldName) return;
    if (allCats().indexOf(name) !== -1) { alert('Kategoria „' + name + '” już istnieje.'); return; }
    var i = state.categories.indexOf(oldName);
    if (i !== -1) state.categories[i] = name;
    state.items.forEach(function (it) { if (it.cat === oldName) it.cat = name; });
    if (state.collapsed[oldName] != null) {
      state.collapsed[name] = state.collapsed[oldName];
      delete state.collapsed[oldName];
    }
    if (state.catFilter === oldName) state.catFilter = name;
    save(); renderCatList(); render();
  }

  function moveCat(idx, dir) {
    var arr = state.categories;
    // allCats() może zawierać kategorie spoza state.categories (import) —
    // pracujemy na indeksie z allCats, ale przenosimy w state.categories.
    var cats = allCats();
    var name = cats[idx];
    var j = state.categories.indexOf(name);
    if (j === -1) return;
    var k = j + dir;
    if (k < 0 || k >= state.categories.length) return;
    var tmp = state.categories[k];
    state.categories[k] = state.categories[j];
    state.categories[j] = tmp;
    save(); renderCatList(); render();
  }

  function deleteCat(name) {
    var cats = allCats();
    if (cats.length < 2) { alert('Musi zostać co najmniej jedna kategoria.'); return; }
    var cnt = itemsInCat(name);
    var target = cats.filter(function (c) { return c !== name; })[0];
    var msg = cnt
      ? 'Usunąć „' + name + '”? ' + cnt + ' ' + (cnt === 1 ? 'pozycja zostanie przeniesiona' : 'pozycji zostanie przeniesionych') + ' do „' + target + '”.'
      : 'Usunąć kategorię „' + name + '”?';
    if (!confirm(msg)) return;
    if (cnt) snapshot('Usunięto kategorię „' + name + '”');
    state.items.forEach(function (it) { if (it.cat === name) it.cat = target; });
    state.categories = state.categories.filter(function (c) { return c !== name; });
    delete state.collapsed[name];
    if (state.catFilter === name) state.catFilter = null;
    save(); renderCatList(); render();
    if (cnt) showToast('Przeniesiono ' + cnt + ' do „' + target + '”', true);
  }

  function addCat() {
    var inp = document.getElementById('newCatName');
    var name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    if (allCats().indexOf(name) !== -1) { alert('Kategoria „' + name + '” już istnieje.'); return; }
    state.categories.push(name);
    inp.value = '';
    save(); renderCatList(); render();
  }

  document.getElementById('catBtn').addEventListener('click', openCatSheet);
  document.getElementById('closeCatBtn').addEventListener('click', closeSheets);
  document.getElementById('addCatBtn').addEventListener('click', addCat);
  document.getElementById('newCatName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addCat(); }
  });

  // ---------- eksport / import / reset ----------
  document.getElementById('exportBtn').addEventListener('click', function () {
    var data = JSON.stringify({ app: 'dalpack-magazyn', exported: new Date().toISOString(), categories: state.categories, items: state.items, history: state.history }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'magazyn-dalpack-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });

  var importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function () { importFile.click(); });
  importFile.addEventListener('change', function () {
    var file = importFile.files[0];
    importFile.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var items = Array.isArray(data) ? data : data.items;
        if (!Array.isArray(items)) throw new Error('bad format');
        var cleaned = items.filter(function (x) { return x && typeof x.name === 'string'; }).map(normalizeItem);
        if (!cleaned.length) throw new Error('empty');
        snapshot('Zaimportowano dane');
        state.items = cleaned;
        state.loadPlan = {};
        // kategorie: z pliku (jeśli są), inaczej odbudowa ze stałych + z pozycji
        state.categories = (Array.isArray(data.categories) && data.categories.length)
          ? data.categories.filter(function (c) { return typeof c === 'string'; })
          : CATEGORIES.slice();
        cleaned.forEach(function (it) {
          if (state.categories.indexOf(it.cat) === -1) state.categories.push(it.cat);
        });
        logEvent('import', { delta: cleaned.length });
        save(); render(); closeSheets();
        showToast('Zaimportowano ' + cleaned.length + ' pozycji', true);
      } catch (e) {
        alert('Nie udało się odczytać pliku — to nie jest kopia zapasowa magazynu.');
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Przywrócić listę startową? Wszystkie ilości zostaną wyzerowane.')) return;
    snapshot('Przywrócono dane startowe');
    state.items = seedItems();
    state.categories = CATEGORIES.slice();
    state.loadPlan = {};
    logEvent('reset', {});
    save(); render(); closeSheets();
    showToast('Przywrócono dane startowe', true);
  });

  // ---------- toast / undo ----------
  var toastEl = document.getElementById('toast');
  function showToast(msg, canUndo) {
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('undoBtn').style.display = canUndo ? '' : 'none';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 5000);
  }
  document.getElementById('undoBtn').addEventListener('click', function () {
    if (!undoSnapshot) return;
    state.items = undoSnapshot.items;
    state.loadPlan = undoSnapshot.loadPlan || {};
    if (undoSnapshot.categories) state.categories = undoSnapshot.categories;
    undoSnapshot = null;
    save(); render();
    toastEl.classList.remove('show');
  });

  // ---------- zakładki i szukanie ----------
  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    state.tab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t === btn);
    });
    save(); render();
  });
  var initialTab = document.querySelector('.tab[data-tab="' + state.tab + '"]');
  if (initialTab) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t === initialTab);
    });
  } else {
    state.tab = 'all';
  }

  searchInput.addEventListener('input', render);

  render();
})();
</script>
